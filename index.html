<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A — Cosmic Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --fire-orange: #ff9d00;
      --fire-orange-light: #ffb340;
      --fire-orange-glow: rgba(255, 157, 0, 0.6);
      --fire-orange-dim: rgba(255, 157, 0, 0.15);
      --neon-white: #e8e8e8;
      --neon-white-dim: rgba(232, 232, 232, 0.45);
      --text-secondary: rgba(232, 232, 232, 0.6);
      --glass-bg: rgba(255, 255, 255, 0.025);
      --glass-border: rgba(255, 255, 255, 0.06);
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.1);
    }

    html, body {
      height: 100%;
    }

    body {
      background: #000000;
      color: var(--neon-white);
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ════════════════════════════════════════
       CANVAS STARFIELD
       ════════════════════════════════════════ */
    #starCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .stars-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars-dense {
      background-image:
        radial-gradient(1px 1px at  2%  8%, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at  5% 25%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at  8% 62%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 11% 41%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 14% 78%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 17% 15%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 20% 92%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 23% 33%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 26% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 29% 18%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 32% 85%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 35% 48%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 38% 72%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 41%  5%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 44% 38%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 47% 88%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 50% 22%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 53% 65%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 56% 42%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 59% 78%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 62% 12%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 68% 32%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 71% 88%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 74% 18%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 77% 62%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 80% 45%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 83% 75%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 86% 28%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 89% 92%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 92% 15%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 95% 58%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 98% 35%, rgba(255,255,255,0.55), transparent);
    }

    .stars-bright {
      background-image:
        radial-gradient(2.5px 2.5px at 10% 20%, rgba(255,157,0,0.6), transparent),
        radial-gradient(2px 2px at 25% 65%, rgba(255,255,255,0.8), transparent),
        radial-gradient(2.5px 2.5px at 40% 40%, rgba(255,157,0,0.5), transparent),
        radial-gradient(2px 2px at 55% 80%, rgba(255,255,255,0.7), transparent),
        radial-gradient(2.5px 2.5px at 70% 15%, rgba(255,157,0,0.55), transparent),
        radial-gradient(2px 2px at 85% 55%, rgba(255,255,255,0.75), transparent),
        radial-gradient(3px 3px at 30% 90%, rgba(255,157,0,0.45), transparent),
        radial-gradient(2.5px 2.5px at 65% 35%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2.5px 2.5px at 90% 80%, rgba(255,157,0,0.5), transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .stars-slow {
      background-image:
        radial-gradient(3.5px 3.5px at 15% 50%, rgba(255,157,0,0.3), transparent),
        radial-gradient(3px 3px at 45% 25%, rgba(255,157,0,0.25), transparent),
        radial-gradient(3.5px 3.5px at 75% 70%, rgba(255,157,0,0.2), transparent),
        radial-gradient(3px 3px at 60% 90%, rgba(255,255,255,0.35), transparent),
        radial-gradient(3.5px 3.5px at 88% 15%, rgba(255,157,0,0.25), transparent);
      animation: twinkle 6s ease-in-out infinite alternate-reverse, drift 200s linear infinite;
    }

    @keyframes twinkle {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }

    @keyframes drift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-10px, 8px); }
      50%  { transform: translate(-20px, 0); }
      75%  { transform: translate(-10px, -8px); }
      100% { transform: translate(0, 0); }
    }

    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 800px 600px at 10% 90%, rgba(255,157,0,0.05), transparent),
        radial-gradient(ellipse 700px 700px at 90% 10%, rgba(100,50,255,0.03), transparent),
        radial-gradient(ellipse 1000px 500px at 50% 50%, rgba(255,157,0,0.025), transparent);
    }

    /* ════════════════════════════════════════
       MAIN CONTAINER — 2 COLUMNS
       ════════════════════════════════════════ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      width: 92%;
      display: flex;
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 0 150px rgba(255,157,0,0.05),
        0 40px 80px rgba(0,0,0,0.6),
        0 0 1px rgba(255,255,255,0.1);
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ════════════════════════════════════════
       LEFT — FORM SIDE
       ════════════════════════════════════════ */
    .form-side {
      flex: 1;
      background: #000;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .form-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 90% 65%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 20% 70%, rgba(255,180,80,0.35), transparent),
        radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,180,80,0.3), transparent);
      animation: form-stars-twinkle 5s ease-in-out infinite alternate;
    }

    @keyframes form-stars-twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }

    .form-nebula {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 250px 200px at 15% 85%, rgba(255,157,0,0.03), transparent),
        radial-gradient(ellipse 200px 180px at 85% 15%, rgba(100,60,200,0.02), transparent);
    }

    .form-orbital {
      position: absolute;
      top: 50%; left: 50%;
      width: 500px; height: 500px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      border: 1px solid rgba(255,157,0,0.03);
      animation: orbital-spin 60s linear infinite;
    }

    @keyframes orbital-spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .form-content {
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      margin-bottom: 6px;
      animation: glow 4s ease-in-out infinite;
      background: linear-gradient(135deg, var(--fire-orange), var(--fire-orange-light), #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(255,157,0,0.5));
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(255,157,0,0.5)); }
      50% { filter: drop-shadow(0 0 60px rgba(255,157,0,0.7)) drop-shadow(0 0 120px rgba(255,157,0,0.3)); }
    }

    .event-info {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      color: var(--neon-white-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .event-info .venue {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      color: var(--neon-white-dim);
      font-weight: 400;
    }

    .event-info .date {
      font-family: 'Orbitron', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.45em;
      color: rgba(255,157,0,0.45);
    }

    .event-info .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--fire-orange-dim), transparent);
    }

    .intro {
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.8;
    }

    .intro .jp {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--neon-white);
    }

    .intro .en {
      display: block;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .field {
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--neon-white);
    }

    .field label .hint {
      font-weight: 400;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--neon-white);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--fire-orange);
      background: rgba(255,157,0,0.03);
      box-shadow: 0 0 0 3px rgba(255,157,0,0.1), 0 0 20px rgba(255,157,0,0.06);
    }

    .field textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    .submit-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      padding: 15px 0;
      border: 1px solid rgba(255,157,0,0.5);
      border-radius: 10px;
      background: transparent;
      color: var(--fire-orange);
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,157,0,0.1), transparent);
      transition: left 0.6s;
    }

    .submit-btn:hover::before { left: 100%; }

    .submit-btn .sub {
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .submit-btn:hover {
      background: var(--fire-orange);
      border-color: var(--fire-orange);
      color: #000;
      box-shadow: 0 0 28px rgba(255,157,0,0.3);
      transform: translateY(-2px);
    }

    .submit-btn:hover .sub { color: rgba(0,0,0,0.45); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .submit-btn:disabled::before { display: none; }

    /* ════════════════════════════════════════
       RIGHT — COSMIC CURIOSITY SCENE
       ════════════════════════════════════════ */
    .cosmic-side {
      flex: 1.2;
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    /* Deep space base */
    .cosmic-base {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(10,5,20,1) 0%, #000 100%);
    }

    /* Nebula clouds — soft deep cosmic */
    .cosmic-nebula-1 {
      position: absolute;
      top: 15%; left: 10%;
      width: 380px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(80,40,160,0.06) 0%, rgba(50,25,120,0.03) 40%, transparent 70%);
      filter: blur(55px);
      animation: nebula-float-1 18s ease-in-out infinite;
      pointer-events: none;
    }

    .cosmic-nebula-2 {
      position: absolute;
      bottom: 10%; right: 8%;
      width: 320px; height: 270px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(180,80,20,0.05) 0%, rgba(120,50,10,0.025) 40%, transparent 70%);
      filter: blur(50px);
      animation: nebula-float-2 22s ease-in-out infinite;
      pointer-events: none;
    }

    .cosmic-nebula-3 {
      position: absolute;
      top: 55%; left: 55%;
      width: 280px; height: 220px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(40,20,120,0.04) 0%, transparent 60%);
      filter: blur(45px);
      animation: nebula-float-3 25s ease-in-out infinite;
      pointer-events: none;
    }

    .cosmic-nebula-4 {
      position: absolute;
      top: 30%; right: 20%;
      width: 200px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(100,60,180,0.04) 0%, transparent 65%);
      filter: blur(50px);
      animation: nebula-float-2 20s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes nebula-float-1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(20px, -15px) scale(1.1); opacity: 1; }
    }

    @keyframes nebula-float-2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-15px, 10px) scale(1.08); opacity: 0.9; }
    }

    @keyframes nebula-float-3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; }
    }

    /* Central glowing orb — soft deep light */
    .cosmic-orb {
      position: absolute;
      top: 45%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(220,200,160,0.2) 0%,
        rgba(200,170,100,0.12) 20%,
        rgba(180,130,60,0.08) 40%,
        rgba(150,100,40,0.04) 60%,
        transparent 100%
      );
      box-shadow:
        0 0 60px 20px rgba(180,140,60,0.08),
        0 0 120px 40px rgba(150,100,40,0.04),
        0 0 200px 80px rgba(120,80,30,0.02);
      pointer-events: none;
      z-index: 5;
    }

    /* Soft glow halo around orb */
    .cosmic-orb-halo {
      position: absolute;
      top: 45%; left: 50%;
      width: 400px; height: 400px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(180,140,60,0.04) 0%,
        rgba(150,100,40,0.02) 40%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 4;
    }

    /* Orbital rings around the central orb */
    .cosmic-ring-1 {
      position: absolute;
      top: 45%; left: 50%;
      width: 340px; height: 340px;
      transform: translate(-50%, -50%) rotateX(70deg);
      border-radius: 50%;
      border: 2px solid rgba(180,140,60,0.18);
      box-shadow:
        0 0 12px 4px rgba(150,100,40,0.06),
        inset 0 0 12px 4px rgba(150,100,40,0.05);
      animation: ring-spin-1 12s linear infinite;
      pointer-events: none;
      z-index: 4;
    }

    .cosmic-ring-2 {
      position: absolute;
      top: 45%; left: 50%;
      width: 480px; height: 480px;
      transform: translate(-50%, -50%) rotateX(75deg) rotateZ(30deg);
      border-radius: 50%;
      border: 2px solid rgba(100,70,180,0.1);
      box-shadow:
        0 0 10px 3px rgba(80,50,160,0.05),
        inset 0 0 10px 3px rgba(80,50,160,0.04);
      animation: ring-spin-2 18s linear infinite reverse;
      pointer-events: none;
      z-index: 3;
    }

    .cosmic-ring-3 {
      position: absolute;
      top: 45%; left: 50%;
      width: 620px; height: 620px;
      transform: translate(-50%, -50%) rotateX(65deg) rotateZ(-20deg);
      border-radius: 50%;
      border: 1.5px solid rgba(150,100,40,0.07);
      box-shadow:
        0 0 8px 2px rgba(120,80,30,0.04),
        inset 0 0 8px 2px rgba(120,80,30,0.03);
      animation: ring-spin-3 25s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes ring-spin-1 {
      0% { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); }
      100% { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
    }

    @keyframes ring-spin-2 {
      0% { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(30deg); }
      100% { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(390deg); }
    }

    @keyframes ring-spin-3 {
      0% { transform: translate(-50%, -50%) rotateX(65deg) rotateZ(-20deg); }
      100% { transform: translate(-50%, -50%) rotateX(65deg) rotateZ(340deg); }
    }

    /* Floating light particles — very soft */
    .cosmic-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background:
        radial-gradient(2px 2px at 20% 25%, rgba(200,170,100,0.25), transparent),
        radial-gradient(2px 2px at 75% 60%, rgba(180,140,70,0.2), transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, rgba(200,170,100,0.18), transparent),
        radial-gradient(2px 2px at 60% 20%, rgba(180,140,70,0.22), transparent),
        radial-gradient(1.5px 1.5px at 30% 50%, rgba(200,170,100,0.15), transparent),
        radial-gradient(2px 2px at 80% 40%, rgba(180,140,70,0.18), transparent),
        radial-gradient(1.5px 1.5px at 55% 85%, rgba(200,170,100,0.15), transparent),
        radial-gradient(2px 2px at 15% 65%, rgba(180,140,70,0.2), transparent),
        radial-gradient(1.5px 1.5px at 65% 45%, rgba(100,70,180,0.15), transparent),
        radial-gradient(2px 2px at 45% 30%, rgba(100,70,180,0.12), transparent),
        radial-gradient(1.5px 1.5px at 85% 75%, rgba(200,170,100,0.18), transparent),
        radial-gradient(2px 2px at 25% 80%, rgba(180,140,70,0.15), transparent);
      animation: cosmic-particles-drift 25s linear infinite;
    }

    @keyframes cosmic-particles-drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-20px, 15px); }
    }

    /* Distant stars — soft subtle dots */
    .cosmic-distant-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(1.5px 1.5px at 10% 10%, rgba(220,210,180,0.5), transparent),
        radial-gradient(1.5px 1.5px at 30% 85%, rgba(220,210,180,0.4), transparent),
        radial-gradient(1.5px 1.5px at 50% 15%, rgba(220,210,180,0.45), transparent),
        radial-gradient(1.5px 1.5px at 70% 70%, rgba(220,210,180,0.35), transparent),
        radial-gradient(1.5px 1.5px at 90% 30%, rgba(220,210,180,0.4), transparent),
        radial-gradient(1.5px 1.5px at 15% 55%, rgba(220,210,180,0.3), transparent),
        radial-gradient(1.5px 1.5px at 85% 50%, rgba(220,210,180,0.35), transparent),
        radial-gradient(1.5px 1.5px at 45% 90%, rgba(220,210,180,0.3), transparent),
        radial-gradient(2px 2px at 65% 25%, rgba(180,150,80,0.3), transparent),
        radial-gradient(2px 2px at 25% 40%, rgba(180,150,80,0.25), transparent);
      animation: distant-twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes distant-twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }

    /* Mystery question mark — subtle */
    .cosmic-mystery {
      position: absolute;
      top: 18%; right: 20%;
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      color: rgba(180,150,80,0.06);
      text-shadow: 0 0 15px rgba(150,100,40,0.04);
      animation: mystery-pulse 10s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes mystery-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    /* Vignette — seamless edge blend */
    .cosmic-vignette {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: radial-gradient(ellipse 80% 75% at 50% 45%, transparent 30%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.85) 85%, #000 100%);
      box-shadow:
        inset 40px 0 60px -10px rgba(0,0,0,0.9),
        inset -40px 0 60px -10px rgba(0,0,0,0.9),
        inset 0 30px 50px -10px rgba(0,0,0,0.8),
        inset 0 -30px 50px -10px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    /* ════════════════════════════════════════
       SUCCESS STATE
       ════════════════════════════════════════ */
    .success-screen {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 40px;
      background: rgba(0,0,0,0.95);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .success-screen.visible { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      width: 80px; height: 80px;
      border: 2px solid rgba(255,157,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: orb-pulse 3s ease-in-out infinite;
      box-shadow: 0 0 25px rgba(255,157,0,0.15);
    }

    .success-icon svg {
      width: 34px; height: 34px;
      fill: none;
      stroke: var(--fire-orange);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-title {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      color: var(--fire-orange);
      letter-spacing: 0.25em;
      margin-bottom: 8px;
      animation: glow 3s ease-in-out infinite;
    }

    .success-sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 36px;
      letter-spacing: 0.15em;
    }

    .reload-btn {
      padding: 14px 36px;
      border: 1px solid rgba(255,157,0,0.5);
      border-radius: 10px;
      background: transparent;
      color: var(--fire-orange);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.7;
    }

    .reload-btn small {
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .reload-btn:hover {
      background: var(--fire-orange);
      border-color: var(--fire-orange);
      color: #000;
      box-shadow: 0 0 24px rgba(255,157,0,0.3);
      transform: translateY(-2px);
    }

    .reload-btn:hover small { color: rgba(0,0,0,0.45); }

    /* ════════════════════════════════════════
       RESPONSIVE
       ════════════════════════════════════════ */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
        width: 94%;
        border-radius: 20px;
      }

      .cosmic-side {
        flex: none;
        height: 260px;
        min-height: 0;
      }

      .form-side {
        padding: 36px 24px;
      }

      .title {
        font-size: 2.2rem;
        letter-spacing: 0.2em;
      }

      .cosmic-orb {
        width: 140px; height: 140px;
      }

      .cosmic-orb-halo {
        width: 280px; height: 280px;
      }

      .cosmic-ring-1 { width: 250px; height: 250px; }
      .cosmic-ring-2 { width: 370px; height: 370px; }
      .cosmic-ring-3 { width: 480px; height: 480px; }

      .success-title { font-size: 1.5rem; }
      .success-icon { width: 64px; height: 64px; }
      .success-icon svg { width: 28px; height: 28px; }
    }

    @media (max-width: 480px) {
      .form-side { padding: 28px 18px; }
      .title { font-size: 1.8rem; letter-spacing: 0.15em; }
      .event-info { font-size: 0.6rem; letter-spacing: 0.25em; }
      .cosmic-side { height: 200px; }
      .cosmic-orb { width: 100px; height: 100px; }
      .cosmic-orb-halo { width: 200px; height: 200px; }
      .cosmic-ring-1 { width: 200px; height: 200px; }
      .cosmic-ring-2 { width: 300px; height: 300px; }
      .cosmic-ring-3 { width: 400px; height: 400px; }
    }
  </style>
</head>
<body>

  <canvas id="starCanvas"></canvas>
  <div class="nebula"></div>
  <div class="stars-layer stars-dense"></div>
  <div class="stars-layer stars-bright"></div>
  <div class="stars-layer stars-slow"></div>

  <div class="container" id="container">

    <!-- LEFT: Form -->
    <div class="form-side" id="formSide">
      <div class="form-stars"></div>
      <div class="form-nebula"></div>
      <div class="form-orbital"></div>

      <div class="form-content">
        <div class="header">
          <h1 class="title">Q&amp;A</h1>
          <div class="event-info">
            <span class="venue">日曜用賀劇場</span>
            <span class="divider"></span>
            <span class="date">2026 . 06 . 28</span>
          </div>
        </div>

        <div class="intro">
          <p class="jp">
            貴重なお時間を割いてご質問をお寄せいただき、<br>誠にありがとうございます。
          </p>
          <span class="en">
            Thank you for taking the time to share your questions with us.
          </span>
        </div>

        <form id="qaForm" action="https://docs.google.com/forms/d/e/1FAIpQLSduh2SBoK818q6ImZXugYKanjmU0xYxC_9FomspQ1xga-er-A/formResponse" method="POST">
          <div class="field">
            <label for="nameInput">お名前 / Name <span class="hint">(Nickname OK)</span></label>
            <input type="text" id="nameInput" name="entry.437985863" placeholder="お名前をご入力ください / Please enter your name" required />
          </div>

          <div class="field">
            <label for="questionInput">ご質問 / Your Question</label>
            <textarea id="questionInput" name="entry.194700298" placeholder="ご質問内容をご記入ください / Please enter your question details" required></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="main">送信</span>
            <span class="sub">TRANSMIT</span>
          </button>
        </form>
      </div>
    </div>

    <!-- RIGHT: Cosmic curiosity scene -->
    <div class="cosmic-side">
      <div class="cosmic-base"></div>
      <div class="cosmic-nebula-1"></div>
      <div class="cosmic-nebula-2"></div>
      <div class="cosmic-nebula-3"></div>
      <div class="cosmic-nebula-4"></div>
      <div class="cosmic-distant-stars"></div>
      <div class="cosmic-ring-3"></div>
      <div class="cosmic-ring-2"></div>
      <div class="cosmic-ring-1"></div>
      <div class="cosmic-orb-halo"></div>
      <div class="cosmic-orb"></div>
      <div class="cosmic-particles"></div>
      <div class="cosmic-mystery">?</div>
      <div class="cosmic-vignette"></div>
    </div>

    <!-- SUCCESS overlay -->
    <div class="success-screen" id="successScreen">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="success-title">送信完了</div>
      <p class="success-sub">TRANSMISSION SUCCESSFUL</p>
      <button class="reload-btn" id="reloadBtn">
        新しい信号を送信<br><small>SEND NEW SIGNAL</small>
      </button>
    </div>

  </div>

  <script>
    // Canvas starfield
    (function() {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const STAR_COUNT = 300;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.8 + 0.3,
            alpha: Math.random() * 0.7 + 0.3,
            speed: Math.random() * 0.0008 + 0.0002,
            phase: Math.random() * Math.PI * 2,
            isOrange: Math.random() < 0.12
          });
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const twinkle = Math.sin(time * s.speed + s.phase) * 0.3 + 0.7;
          const a = s.alpha * twinkle;
          if (s.isOrange) {
            ctx.fillStyle = `rgba(255, 180, 60, ${a})`;
            ctx.shadowColor = 'rgba(255, 157, 0, 0.4)';
            ctx.shadowBlur = 6;
          } else {
            ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
            ctx.shadowBlur = 4;
          }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
      }

      resize();
      createStars();
      requestAnimationFrame(draw);
      window.addEventListener('resize', () => { resize(); createStars(); });
    })();

    // Form logic
    const form = document.getElementById('qaForm');
    const submitBtn = document.getElementById('submitBtn');
    const success = document.getElementById('successScreen');
    const reloadBtn = document.getElementById('reloadBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnMain = submitBtn.querySelector('.main');
      const btnSub = submitBtn.querySelector('.sub');

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.4';
      btnMain.textContent = '送信中...';
      btnSub.textContent = 'TRANSMITTING...';

      try {
        const formData = new FormData(form);
        await fetch(form.action, { method: 'POST', mode: 'no-cors', body: formData });
        document.querySelector('.form-side').style.visibility = 'hidden';
        document.querySelector('.cosmic-side').style.visibility = 'hidden';
        success.classList.add('visible');
      } catch (err) {
        alert('送信に失敗しました。もう一度お試しください。\nSubmission failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        btnMain.textContent = '送信';
        btnSub.textContent = 'TRANSMIT';
      }
    });

    reloadBtn.addEventListener('click', () => location.reload());
  </script>

</body>
</html>
