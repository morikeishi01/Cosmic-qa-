<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A — Cosmic Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --fire-orange: #ff9d00;
      --fire-orange-light: #ffb340;
      --fire-orange-glow: rgba(255, 157, 0, 0.6);
      --fire-orange-dim: rgba(255, 157, 0, 0.15);
      --neon-white: #e8e8e8;
      --neon-white-dim: rgba(232, 232, 232, 0.45);
      --text-secondary: rgba(232, 232, 232, 0.6);
      --glass-bg: rgba(255, 255, 255, 0.025);
      --glass-border: rgba(255, 255, 255, 0.06);
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.1);
    }

    html, body {
      height: 100%;
    }

    body {
      background: #000000;
      color: var(--neon-white);
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ════════════════════════════════════════
       STARFIELD — Canvas-rendered via CSS
       ════════════════════════════════════════ */
    .stars-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars-dense {
      background-image:
        radial-gradient(1px 1px at  2%  8%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at  5% 25%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at  8% 62%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 11% 41%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 14% 78%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 17% 15%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 20% 92%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1px 1px at 23% 33%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 26% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 29% 18%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 32% 85%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 35% 48%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 38% 72%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 41%  5%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 44% 38%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 47% 88%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1px 1px at 50% 22%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 53% 65%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 56% 42%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 59% 78%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 62% 12%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 68% 32%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 71% 88%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1px 1px at 74% 18%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 77% 62%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 80% 45%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 83% 75%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 86% 28%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 89% 92%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 92% 15%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px 1px at 95% 58%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 98% 35%, rgba(255,255,255,0.45), transparent);
    }

    .stars-bright {
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,157,0,0.4), transparent),
        radial-gradient(1.5px 1.5px at 25% 65%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 40% 40%, rgba(255,157,0,0.3), transparent),
        radial-gradient(1.5px 1.5px at 55% 80%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 70% 15%, rgba(255,157,0,0.35), transparent),
        radial-gradient(1.5px 1.5px at 85% 55%, rgba(255,255,255,0.55), transparent),
        radial-gradient(2.5px 2.5px at 30% 90%, rgba(255,157,0,0.25), transparent),
        radial-gradient(2px 2px at 65% 35%, rgba(255,255,255,0.4), transparent),
        radial-gradient(2px 2px at 90% 80%, rgba(255,157,0,0.3), transparent);
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    .stars-slow {
      background-image:
        radial-gradient(3px 3px at 15% 50%, rgba(255,157,0,0.15), transparent),
        radial-gradient(2.5px 2.5px at 45% 25%, rgba(255,157,0,0.12), transparent),
        radial-gradient(3px 3px at 75% 70%, rgba(255,157,0,0.1), transparent),
        radial-gradient(2.5px 2.5px at 60% 90%, rgba(255,255,255,0.2), transparent),
        radial-gradient(3px 3px at 88% 15%, rgba(255,157,0,0.12), transparent);
      animation: twinkle 8s ease-in-out infinite alternate-reverse, drift 200s linear infinite;
    }

    @keyframes twinkle {
      0%   { opacity: 0.3; }
      100% { opacity: 1; }
    }

    @keyframes drift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-10px, 8px); }
      50%  { transform: translate(-20px, 0); }
      75%  { transform: translate(-10px, -8px); }
      100% { transform: translate(0, 0); }
    }

    /* Cosmic dust nebula */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 700px 500px at 15% 85%, rgba(255,157,0,0.025), transparent),
        radial-gradient(ellipse 600px 600px at 85% 15%, rgba(80,40,200,0.015), transparent),
        radial-gradient(ellipse 900px 400px at 50% 50%, rgba(255,157,0,0.01), transparent);
    }

    /* ════════════════════════════════════════
       MAIN CONTAINER
       ════════════════════════════════════════ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      width: 92%;
      display: flex;
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 0 120px rgba(255,157,0,0.03),
        0 40px 80px rgba(0,0,0,0.6),
        0 0 1px rgba(255,255,255,0.1);
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    /* ════════════════════════════════════════
       LEFT — FORM SIDE
       ════════════════════════════════════════ */
    .form-side {
      flex: 1;
      background: rgba(0,0,0,0.85);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .form-side::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 5%,
        rgba(255,157,0,0.15) 25%,
        rgba(255,157,0,0.25) 50%,
        rgba(255,157,0,0.15) 75%,
        transparent 95%
      );
    }

    /* ──── HEADER ──── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      margin-bottom: 6px;
      animation: glow 4s ease-in-out infinite;
      background: linear-gradient(135deg, var(--fire-orange), var(--fire-orange-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(255,157,0,0.3));
    }

    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(255,157,0,0.3));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(255,157,0,0.5)) drop-shadow(0 0 80px rgba(255,157,0,0.2));
      }
    }

    .event-info {
      font-family: 'Orbitron', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      color: var(--neon-white-dim);
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .event-info .line {
      width: 32px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--fire-orange-dim));
    }

    .event-info .line:last-child {
      background: linear-gradient(to left, transparent, var(--fire-orange-dim));
    }

    .intro {
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.8;
    }

    .intro .jp {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--neon-white);
      letter-spacing: 0.02em;
    }

    .intro .en {
      display: block;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-style: italic;
      letter-spacing: 0.01em;
    }

    /* ──── FORM FIELDS ──── */
    .field {
      margin-bottom: 28px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--neon-white);
      letter-spacing: 0.03em;
    }

    .field label .hint {
      font-weight: 400;
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 15px 18px;
      color: var(--neon-white);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.01em;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--fire-orange);
      background: rgba(255,157,0,0.03);
      box-shadow:
        0 0 0 3px rgba(255,157,0,0.1),
        0 0 24px rgba(255,157,0,0.06);
    }

    .field textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.6;
    }

    /* ──── SUBMIT BUTTON ──── */
    .submit-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      padding: 17px 0;
      border: 1px solid rgba(255,157,0,0.5);
      border-radius: 12px;
      background: transparent;
      color: var(--fire-orange);
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,157,0,0.1), transparent);
      transition: left 0.6s;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn .sub {
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .submit-btn:hover {
      background: var(--fire-orange);
      border-color: var(--fire-orange);
      color: #000;
      box-shadow: 0 0 32px rgba(255,157,0,0.3);
      transform: translateY(-2px);
    }

    .submit-btn:hover .sub {
      color: rgba(0,0,0,0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    .submit-btn:disabled::before {
      display: none;
    }

    /* ════════════════════════════════════════
       RIGHT — BLACK HOLE — DRAMATIC
       ════════════════════════════════════════ */
    .image-side {
      flex: 1.3;
      position: relative;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    /* Black hole image */
    .bh-image {
      position: absolute;
      inset: -20px;
      background:
        url("https://upload.wikimedia.org/wikipedia/commons/e/ed/Black_Hole_with_Accretion_Disk_3.jpg")
        center center / cover no-repeat;
      filter: brightness(1.1) contrast(1.15) saturate(1.2);
      animation: bh-drift 30s ease-in-out infinite;
    }

    @keyframes bh-drift {
      0%, 100% { transform: scale(1.05) translate(0, 0); }
      33%      { transform: scale(1.08) translate(-8px, 5px); }
      66%      { transform: scale(1.06) translate(5px, -3px); }
    }

    /* Heavy vignette — seamless edge blend */
    .bh-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse 55% 50% at 50% 50%, transparent 15%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.8) 75%, #000 100%);
      box-shadow:
        inset 60px 0 100px -20px rgba(0,0,0,1),
        inset -60px 0 100px -20px rgba(0,0,0,1),
        inset 0 60px 100px -20px rgba(0,0,0,0.95),
        inset 0 -60px 100px -20px rgba(0,0,0,0.95);
      pointer-events: none;
    }

    /* Accretion disk glow — multiple rings */
    .bh-glow-core {
      position: absolute;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        transparent 25%,
        rgba(255,157,0,0.08) 40%,
        rgba(255,157,0,0.15) 50%,
        rgba(255,157,0,0.08) 60%,
        transparent 75%
      );
      animation: pulse-glow 4s ease-in-out infinite;
    }

    .bh-glow-outer {
      position: absolute;
      top: 50%; left: 50%;
      width: 360px; height: 360px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        circle,
        transparent 30%,
        rgba(255,157,0,0.03) 45%,
        rgba(255,157,0,0.06) 55%,
        rgba(255,157,0,0.03) 65%,
        transparent 80%
      );
      animation: pulse-glow 6s ease-in-out infinite reverse;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    /* Breathing light sweep */
    .bh-breathe {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(
        ellipse 40% 35% at 50% 48%,
        rgba(255,157,0,0.05) 0%,
        transparent 60%
      );
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50%      { opacity: 0.8; transform: scale(1.08); }
    }

    /* Lens flare streak */
    .bh-flare {
      position: absolute;
      top: 50%; left: 50%;
      width: 300px; height: 2px;
      transform: translate(-50%, -50%) rotate(-15deg);
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,157,0,0.08) 20%,
        rgba(255,200,100,0.12) 50%,
        rgba(255,157,0,0.08) 80%,
        transparent
      );
      filter: blur(3px);
      animation: flare-pulse 5s ease-in-out infinite;
    }

    @keyframes flare-pulse {
      0%, 100% { opacity: 0.3; width: 300px; }
      50%      { opacity: 0.7; width: 400px; }
    }

    /* Particle dust overlay */
    .bh-particles {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background:
        radial-gradient(1px 1px at 30% 30%, rgba(255,200,150,0.4), transparent),
        radial-gradient(1px 1px at 70% 60%, rgba(255,200,150,0.3), transparent),
        radial-gradient(1.5px 1.5px at 45% 75%, rgba(255,157,0,0.35), transparent),
        radial-gradient(1px 1px at 60% 25%, rgba(255,200,150,0.25), transparent),
        radial-gradient(1.5px 1.5px at 25% 55%, rgba(255,157,0,0.3), transparent),
        radial-gradient(1px 1px at 80% 40%, rgba(255,200,150,0.2), transparent),
        radial-gradient(1px 1px at 55% 85%, rgba(255,157,0,0.25), transparent),
        radial-gradient(1.5px 1.5px at 40% 15%, rgba(255,200,150,0.3), transparent);
      animation: particle-drift 20s linear infinite;
    }

    @keyframes particle-drift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-30px, 20px); }
    }

    /* ════════════════════════════════════════
       SUCCESS STATE
       ════════════════════════════════════════ */
    .success-screen {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 40px;
      background: rgba(0,0,0,0.95);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .success-screen.visible {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      width: 88px; height: 88px;
      border: 2px solid rgba(255,157,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      animation: pulse-glow 3s ease-in-out infinite;
      box-shadow: 0 0 30px rgba(255,157,0,0.15);
    }

    .success-icon svg {
      width: 38px; height: 38px;
      fill: none;
      stroke: var(--fire-orange);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .success-title {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--fire-orange);
      letter-spacing: 0.25em;
      margin-bottom: 10px;
      animation: glow 3s ease-in-out infinite;
    }

    .success-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 40px;
      letter-spacing: 0.15em;
      font-weight: 400;
    }

    .reload-btn {
      padding: 15px 40px;
      border: 1px solid rgba(255,157,0,0.5);
      border-radius: 12px;
      background: transparent;
      color: var(--fire-orange);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .reload-btn small {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .reload-btn:hover {
      background: var(--fire-orange);
      border-color: var(--fire-orange);
      color: #000;
      box-shadow: 0 0 28px rgba(255,157,0,0.3);
      transform: translateY(-2px);
    }

    .reload-btn:hover small {
      color: rgba(0,0,0,0.45);
    }

    /* ════════════════════════════════════════
       RESPONSIVE
       ════════════════════════════════════════ */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
        width: 94%;
        border-radius: 20px;
      }

      .image-side {
        flex: none;
        height: 280px;
        min-height: 0;
      }

      .form-side {
        padding: 40px 28px;
      }

      .form-side::after {
        display: none;
      }

      .title {
        font-size: 2.4rem;
        letter-spacing: 0.2em;
      }

      .event-info .line {
        width: 24px;
      }

      .success-title {
        font-size: 1.6rem;
      }

      .success-icon {
        width: 72px; height: 72px;
      }

      .success-icon svg {
        width: 30px; height: 30px;
      }
    }

    @media (max-width: 480px) {
      .form-side {
        padding: 32px 20px;
      }

      .title {
        font-size: 2rem;
        letter-spacing: 0.15em;
      }

      .event-info {
        font-size: 0.65rem;
        letter-spacing: 0.25em;
      }

      .image-side {
        height: 220px;
      }

      .bh-glow-outer {
        width: 250px; height: 250px;
      }

      .bh-glow-core {
        width: 140px; height: 140px;
      }
    }
  </style>
</head>
<body>

  <!-- Cosmic background -->
  <div class="nebula"></div>
  <div class="stars-layer stars-dense"></div>
  <div class="stars-layer stars-bright"></div>
  <div class="stars-layer stars-slow"></div>

  <!-- Main container -->
  <div class="container" id="container">

    <!-- LEFT: Form -->
    <div class="form-side" id="formSide">
      <div class="header">
        <h1 class="title">Q&amp;A</h1>
        <div class="event-info">
          <span class="line"></span>
          <span>2026 . 06 . 28 /// 日曜用賀劇場</span>
          <span class="line"></span>
        </div>
      </div>

      <div class="intro">
        <p class="jp">
          宇宙探求の旅へようこそ！<br>アン＆ロックへの質問をお待ちしております。
        </p>
        <span class="en">
          Welcome to our cosmic journey! Please share your questions for An &amp; Loc.
        </span>
      </div>

      <form id="qaForm" action="https://docs.google.com/forms/d/e/1FAIpQLSduh2SBoK818q6ImZXugYKanjmU0xYxC_9FomspQ1xga-er-A/formResponse" method="POST">
        <div class="field">
          <label for="nameInput">お名前 / Name <span class="hint">(Nickname OK)</span></label>
          <input
            type="text"
            id="nameInput"
            name="entry.437985863"
            placeholder="お名前をご入力ください / Please enter your name"
            required
          />
        </div>

        <div class="field">
          <label for="questionInput">ご質問 / Your Question</label>
          <textarea
            id="questionInput"
            name="entry.194700298"
            placeholder="ご質問内容をご記入ください / Please enter your question details"
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="main">送信</span>
          <span class="sub">TRANSMIT</span>
        </button>
      </form>
    </div>

    <!-- RIGHT: Black Hole -->
    <div class="image-side">
      <div class="bh-image"></div>
      <div class="bh-vignette"></div>
      <div class="bh-glow-outer"></div>
      <div class="bh-glow-core"></div>
      <div class="bh-breathe"></div>
      <div class="bh-flare"></div>
      <div class="bh-particles"></div>
    </div>

    <!-- SUCCESS overlay -->
    <div class="success-screen" id="successScreen">
      <div class="success-icon">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-title">送信完了</div>
      <p class="success-sub">TRANSMISSION SUCCESSFUL</p>
      <button class="reload-btn" id="reloadBtn">
        新しい信号を送信<br><small>SEND NEW SIGNAL</small>
      </button>
    </div>

  </div>

  <script>
    const form      = document.getElementById('qaForm');
    const submitBtn = document.getElementById('submitBtn');
    const success   = document.getElementById('successScreen');
    const reloadBtn = document.getElementById('reloadBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnMain = submitBtn.querySelector('.main');
      const btnSub  = submitBtn.querySelector('.sub');

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.4';
      btnMain.textContent = '送信中...';
      btnSub.textContent  = 'TRANSMITTING...';

      try {
        const formData = new FormData(form);

        await fetch(form.action, {
          method: 'POST',
          mode: 'no-cors',
          body: formData,
        });

        document.querySelector('.form-side').style.visibility = 'hidden';
        document.querySelector('.image-side').style.visibility = 'hidden';
        success.classList.add('visible');
      } catch (err) {
        alert('送信に失敗しました。もう一度お試しください。\nSubmission failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        btnMain.textContent = '送信';
        btnSub.textContent  = 'TRANSMIT';
      }
    });

    reloadBtn.addEventListener('click', () => {
      location.reload();
    });
  </script>

</body>
</html>
